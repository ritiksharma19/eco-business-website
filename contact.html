<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | RS EcoFiber – Banana Fiber Manufacturer, Nandurbar</title>
  <meta name="description" content="Contact RS EcoFiber, Nandurbar, Maharashtra for banana fiber, yarn, rope and eco product enquiries, samples and bulk pricing.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <h1>Contact Us</h1>
      <div class="breadcrumb"><a href="index.html">Home</a> / Contact Us</div>
    </div>
  </section>

  <section class="section" id="enquiry">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Get In Touch</span>
        <h2 class="section-title">Let's Talk About Your Requirement</h2>
        <p>Fill in the form for pricing, samples or partnership. We usually reply within 24 hours.</p>
      </div>
      <div class="enquiry-wrap">
        <div class="contact-info reveal">
          <h3>Contact Information</h3>
          <p>Visit our unit, call us or drop a message on WhatsApp.</p>
          <div data-contact-info></div>
        </div>
        <div class="form-card reveal">
          <h3>Enquiry Form</h3>
          <p>Fields marked <span style="color:#c0392b">*</span> are required.</p>
          <form class="enquiry-form" action="enquiry.php" method="POST" novalidate>
            <input type="hidden" name="source" value="Contact page">
            <div class="hp-field" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
            <div class="form-grid">
              <div class="form-group"><label for="c-name">Full Name <span class="req">*</span></label><input id="c-name" name="name" type="text" autocomplete="name" required><span class="error-text"></span></div>
              <div class="form-group"><label for="c-company">Company / Business</label><input id="c-company" name="company" type="text" autocomplete="organization"></div>
              <div class="form-group"><label for="c-email">Email <span class="req">*</span></label><input id="c-email" name="email" type="email" autocomplete="email" required><span class="error-text"></span></div>
              <div class="form-group"><label for="c-phone">Phone / WhatsApp <span class="req">*</span></label><input id="c-phone" name="phone" type="tel" autocomplete="tel" placeholder="+91" required><span class="error-text"></span></div>
              <div class="form-group"><label for="c-city">City / State / Country</label><input id="c-city" name="location" type="text"></div>
              <div class="form-group"><label for="c-product">Product of Interest <span class="req">*</span></label>
                <select id="c-product" name="product" required>
                  <option value="">Select a product</option>
                  <option>Raw Banana Fiber</option>
                  <option>Banana Fiber Yarn</option>
                  <option>Banana Fiber Rope</option>
                  <option>Handicrafts &amp; Mats</option>
                  <option>Banana Fabric</option>
                  <option>Fiber for Paper Pulp</option>
                  <option>Multiple / Other</option>
                </select><span class="error-text"></span></div>
              <div class="form-group"><label for="c-qty">Required Quantity</label><input id="c-qty" name="quantity" type="text" placeholder="e.g. 500 kg / month"></div>
              <div class="form-group"><label for="c-type">Buyer Type</label>
                <select id="c-type" name="buyer_type">
                  <option value="">Select</option>
                  <option>Manufacturer</option>
                  <option>Trader / Distributor</option>
                  <option>Exporter / Importer</option>
                  <option>Artisan / Designer</option>
                  <option>Retail / Individual</option>
                  <option>Other</option>
                </select></div>
              <div class="form-group full"><label for="c-msg">Your Requirement <span class="req">*</span></label><textarea id="c-msg" name="message" placeholder="Tell us about the product, specifications, delivery location, etc." required></textarea><span class="error-text"></span></div>
              <div class="form-group full checkbox-row"><input id="c-consent" type="checkbox" name="consent" value="yes" required><label for="c-consent" style="font-weight:400;color:inherit">I agree to be contacted by RS EcoFiber by phone, email or WhatsApp regarding my enquiry.</label><span class="error-text"></span></div>
            </div>
            <button type="submit" class="btn btn-primary">Submit Enquiry</button>
            <div class="form-status" role="status" aria-live="polite"></div>
          </form>
        </div>
      </div>

      <div class="map-wrap reveal">
        <!-- TODO: replace q= with your exact factory address or Google Maps place link -->
        <iframe src="https://www.google.com/maps?q=Nandurbar,+Maharashtra+425412&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="RS EcoFiber location map"></iframe>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
